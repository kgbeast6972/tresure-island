<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>tressure island</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.2);
    }

    .thumbnail-container {
      width: 100%;
      height: 160px;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-btn {
      position: absolute;
      width: 48px;
      height: 48px;
      background: rgba(56, 189, 248, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
    }

    .card-info {
      padding: 1rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Video Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      width: 90%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
    }

    .modal iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .close-btn {
      position: absolute;
      top: -40px;
      right: 0;
      color: var(--text);
      font-size: 2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>EPISODE 12TH GRADE </h1>
    <p style="color: var(--text-dim);">by : ibrahim amed  </p>
  </header>

  <div class="grid" id="videoGrid"></div>

  <!-- Modal Player -->
  <div class="modal" id="videoModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closePlayer()">&times;</span>
      <iframe id="playerFrame" allow="autoplay" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const API_KEY = 'AIzaSyA_Tiosx991yAPAThr6yKMQ69p71a4-7wQ';
    const FOLDER_ID = '1vI-dFOfgodj9LQ__fYSNd9VCe7_1nxLm';

    async function fetchVideos() {
      const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&fields=files(id,name,thumbnailLink)&key=${API_KEY}`;
      
      try {
        const response = await fetch(url);
        const data = await response.json();
        renderVideos(data.files || []);
      } catch (err) {
        console.error("Error fetching videos:", err);
      }
    }

    function renderVideos(files) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';

      if (files.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">No videos found in folder.</p>';
        return;
      }

      files.forEach(file => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openPlayer(file.id);

        const thumb = file.thumbnailLink ? file.thumbnailLink.replace('=s220', '=s400') : '';

        card.innerHTML = `
          <div class="thumbnail-container">
            ${thumb ? `<img src="${thumb}" alt="${file.name}">` : ''}
            <div class="play-btn">▶</div>
          </div>
          <div class="card-info">
            <div class="card-title">${file.name}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openPlayer(fileId) {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('playerFrame');
      iframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
      modal.style.display = 'flex';
    }

    function closePlayer() {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('playerFrame');
      iframe.src = '';
      modal.style.display = 'none';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('videoModal');
      if (event.target === modal) {
        closePlayer();
      }
    }

    fetchVideos();
  </script>
</body>
</html>
