<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Treasure Island</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 1rem;
      min-height: 100vh;
    }

    @media (min-width: 640px) {
      body { padding: 2rem; }
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      color: var(--accent);
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }

    @media (min-width: 640px) {
      h1 { font-size: 2rem; }
    }

    .toolbar {
      max-width: 1200px;
      margin: 0 auto 1.5rem auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    @media (min-width: 640px) {
      .toolbar {
        flex-direction: row;
        align-items: center;
        gap: 1rem;
      }
    }

    .search-box, .select-box {
      background: var(--card-bg);
      border: 1px solid #334155;
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 16px; /* Prevents auto-zoom on iOS */
      outline: none;
      width: 100%;
    }

    @media (min-width: 640px) {
      .search-box { flex: 1; }
      .select-box { width: auto; }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .thumbnail-container {
      width: 100%;
      height: 160px;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-btn {
      position: absolute;
      width: 48px;
      height: 48px;
      background: rgba(56, 189, 248, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
    }

    .card-info { padding: 1rem; }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Fixed Mobile Video Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
    }

    .modal-wrapper {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-content {
      width: 100%;
      position: relative;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .modal iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .modal-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .direct-btn {
      background: var(--accent);
      color: #000;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .close-btn {
      color: #fff;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>EPISODE 12TH GRADE</h1>
    <p style="color: var(--text-dim);">by : ibrahim amed</p>
  </header>

  <div class="toolbar">
    <input type="text" id="searchInput" class="search-box" placeholder="Search videos..." oninput="applyFilters()" />
    <select id="sortSelect" class="select-box" onchange="applyFilters()">
      <option value="name-asc">Name (A-Z / 1-9)</option>
      <option value="name-desc">Name (Z-A / 9-1)</option>
    </select>
  </div>

  <div class="grid" id="videoGrid"></div>

  <!-- Mobile-Safe Modal Player -->
  <div class="modal" id="videoModal">
    <div class="modal-wrapper">
      <div class="modal-controls">
        <a id="directLink" href="#" target="_blank" class="direct-btn">📱 Open in Drive App / External</a>
        <button class="close-btn" onclick="closePlayer()">&times;</button>
      </div>
      <div class="modal-content">
        <iframe 
          id="playerFrame" 
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen" 
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = 'AIzaSyA_Tiosx991yAPAThr6yKMQ69p71a4-7wQ';
    const FOLDER_ID = '1vI-dFOfgodj9LQ__fYSNd9VCe7_1nxLm';

    let rawVideos = [];

    async function fetchVideos() {
      const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&fields=files(id,name,thumbnailLink)&key=${API_KEY}`;
      
      try {
        const response = await fetch(url);
        const data = await response.json();
        rawVideos = data.files || [];
        applyFilters();
      } catch (err) {
        console.error("Error fetching videos:", err);
      }
    }

    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const sortValue = document.getElementById('sortSelect').value;

      let filtered = rawVideos.filter(video => 
        video.name.toLowerCase().includes(searchTerm)
      );

      filtered.sort((a, b) => {
        return sortValue === 'name-asc' 
          ? a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' })
          : b.name.localeCompare(a.name, undefined, { numeric: true, sensitivity: 'base' });
      });

      renderVideos(filtered);
    }

    function renderVideos(files) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';

      if (files.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding: 2rem 0;">No videos found.</p>';
        return;
      }

      files.forEach(file => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openPlayer(file.id);

        const thumb = file.thumbnailLink ? file.thumbnailLink.replace('=s220', '=s400') : '';

        card.innerHTML = `
          <div class="thumbnail-container">
            ${thumb ? `<img src="${thumb}" alt="${file.name}" loading="lazy">` : ''}
            <div class="play-btn">▶</div>
          </div>
          <div class="card-info">
            <div class="card-title">${file.name}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openPlayer(fileId) {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('playerFrame');
      const directLink = document.getElementById('directLink');

      iframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
      directLink.href = `https://drive.google.com/file/d/${fileId}/view`;

      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closePlayer() {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('playerFrame');
      iframe.src = '';
      modal.style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('videoModal');
      if (event.target === modal) {
        closePlayer();
      }
    }

    window.onkeydown = function(event) {
      if (event.key === "Escape") {
        closePlayer();
      }
    }

    fetchVideos();
  </script>
</body>
</html>
